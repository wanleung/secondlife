<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>輪迴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 幽冥夜色作底，人生記錄寫喺一頁黃紙「生死簿」上；左邊係此生狀態欄 */
:root{
  --night:#11151c;      /* 幽冥底色 */
  --night-2:#1a2130;    /* 浮起嘅面板 */
  --line:#2b3446;
  --mist:#93a0b6;       /* 夜色上嘅次要文字 */
  --glow:#e9e3d2;       /* 夜色上嘅主文字 */
  --paper:#e9dcb6;      /* 黃紙 */
  --paper-2:#dccb9b;
  --ink:#251d13;        /* 墨 */
  --ink-soft:#5c4d36;
  --gold:#c9a24c;       /* 金箔 */
  --cinnabar:#b5352b;   /* 朱砂：孽 */
  --jade:#3d8a72;       /* 玉：德 */
  --font-brush:"LXGW WenKai TC","Kaiti TC","STKaiti","DFKai-SB","BiauKai",serif;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--night);color:var(--glow);
  font-family:var(--font-ui);font-size:15px;line-height:1.6;
  background-image:radial-gradient(1200px 600px at 50% -200px,#1f2a3d 0%,transparent 70%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--font-brush);font-size:28px;letter-spacing:.2em;color:var(--gold);margin:0;font-weight:700}
.brand small{font-size:13px;color:var(--mist);letter-spacing:.08em;margin-left:10px;font-weight:400;font-family:var(--font-ui)}
.soulbar{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mist);align-items:center}
.soulbar b{color:var(--glow);font-weight:500;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:1px solid var(--line);border-radius:4px;padding:3px 10px;color:var(--mist);font-size:13px}
.linkbtn:hover{color:var(--glow);border-color:var(--mist)}

/* buttons */
.btn{background:var(--gold);color:#1a1408;border:0;border-radius:3px;padding:10px 22px;font-weight:700;letter-spacing:.1em;font-family:var(--font-brush);font-size:18px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--glow);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.red{background:var(--cinnabar);color:#f8eee0}

/* title */
.hero{padding:48px 0 24px;display:grid;gap:22px;max-width:680px}
.hero h2{font-family:var(--font-brush);font-size:clamp(56px,12vw,110px);line-height:1;margin:0;color:var(--paper);letter-spacing:.15em;font-weight:700;text-wrap:balance}
.hero h2 span{color:var(--cinnabar)}
.hero p{margin:0;color:var(--mist);font-size:16px;max-width:60ch}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:6px}
.rule{border-top:1px solid var(--line);padding-top:10px;font-size:14px;color:var(--mist)}
.rule b{display:block;color:var(--glow);font-family:var(--font-brush);font-size:18px;font-weight:700;margin-bottom:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* birth cards */
.sect-h{font-family:var(--font-brush);font-size:30px;color:var(--paper);margin:8px 0 4px;letter-spacing:.06em}
.sub{color:var(--mist);margin:0 0 18px;max-width:70ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--paper);color:var(--ink);border-radius:2px;padding:18px 18px 16px;display:grid;gap:10px;align-content:start;
  box-shadow:0 1px 0 var(--paper-2),0 12px 30px rgba(0,0,0,.35);position:relative}
.card h3{margin:0;font-family:var(--font-brush);font-size:28px;line-height:1.1}
.card .cls{font-family:var(--font-brush);font-size:18px;color:var(--cinnabar)}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.card dt{color:var(--ink-soft)}
.card dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.card .odds{font-size:12px;color:var(--ink-soft);border-top:1px dashed var(--paper-2);padding-top:8px}
.card .btn{justify-self:start;background:var(--ink);color:var(--paper)}
.card.beast{background:#3a2a22;color:#f0e2c8}
.card.beast dt,.card.beast .odds{color:#c9b597}

/* life layout */
.life{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.life{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--night-2);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:12px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:760px){.panel{position:static}}
.who{font-family:var(--font-brush);font-size:24px;line-height:1.2;color:var(--paper)}
.who small{display:block;font-family:var(--font-ui);font-size:13px;color:var(--mist)}
.age{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mist)}
.age b{font-size:30px;color:var(--glow);font-family:var(--font-brush);margin-right:4px}
.stats{display:grid;gap:7px}
.stat{display:grid;grid-template-columns:3.2em 1fr 2.2em;gap:8px;align-items:center;font-size:13px}
.stat .bar{height:6px;background:#0c1016;border-radius:3px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--mist);transition:width .4s}
.stat.hp .bar i{background:#c76a5a}.stat.int .bar i{background:#6f8fd0}.stat.hap .bar i{background:var(--gold)}
.stat.wealth .bar i{background:#a5b85a}.stat.fame .bar i{background:#c58ad0}.stat.jiang .bar i{background:#8b8f99}
.stat span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--mist)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.money div{display:grid;gap:0}
.money small{font-size:12px;color:var(--mist)}
.money b{font-variant-numeric:tabular-nums;font-weight:500;font-size:15px;color:#c9d98a}
.karma{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.karma div{border:1px solid var(--line);border-radius:3px;padding:6px 8px;text-align:center}
.karma b{display:block;font-family:var(--font-brush);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.karma .m b{color:#6cc3a5}.karma .s b{color:#e2675b}
.karma small{font-size:12px;color:var(--mist)}
.meta{font-size:13px;color:var(--mist);display:grid;gap:3px}
.meta b{color:var(--glow);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:1px 9px}
.chip.mem{border-color:var(--mist);color:var(--mist)}

/* 生死簿 */
.book{background:var(--paper);color:var(--ink);border-radius:2px;box-shadow:0 18px 50px rgba(0,0,0,.45);min-width:0;
  background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(181,53,43,.10) 46px 47px);
  padding:22px 22px 18px}
.book h4{margin:0 0 10px;font-family:var(--font-brush);font-size:15px;color:var(--cinnabar);letter-spacing:.3em;font-weight:700}
.log{display:grid;gap:10px;max-height:62vh;overflow-y:auto;padding-right:6px;font-family:var(--font-brush);font-size:17px;line-height:1.7}
@media (max-width:760px){.log{max-height:none}}
.entry{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:10px;animation:ink .5s ease-out}
.entry .y{color:var(--cinnabar);font-variant-numeric:tabular-nums;text-align:right;font-size:14px;padding-top:3px}
.entry.choice{color:var(--ink-soft);font-size:15px}
.entry .k{font-family:var(--font-ui);font-size:12px;border-radius:2px;padding:0 5px;margin-left:6px;white-space:nowrap;vertical-align:2px}
.k.plus{background:var(--jade);color:#f2fbf6}.k.minus{background:var(--cinnabar);color:#fbeeea}
.entry.death{color:var(--cinnabar);font-weight:700}
@keyframes ink{from{opacity:.3;filter:blur(1.5px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){.entry{animation:none}.stat .bar i{transition:none}}
.act{margin-top:16px;border-top:2px solid var(--ink);padding-top:14px;display:grid;gap:10px}
.prompt{font-family:var(--font-brush);font-size:19px;line-height:1.6;margin:0}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:transparent;border:1px solid var(--ink);color:var(--ink);padding:9px 14px;border-radius:2px;font-family:var(--font-brush);font-size:17px}
.choice:hover{background:var(--ink);color:var(--paper)}
.choice.special{border-color:var(--cinnabar);color:var(--cinnabar)}
.choice.special:hover{background:var(--cinnabar);color:var(--paper)}
.book .btn{background:var(--ink);color:var(--paper);justify-self:start}

/* judgement */
.court{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.court{grid-template-columns:minmax(0,1fr)}}
.verdict{font-family:var(--font-brush);font-size:clamp(40px,8vw,64px);line-height:1;margin:4px 0 8px;letter-spacing:.1em}
.ledger{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.ledger li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--paper-2);padding:2px 0}
.ledger .v{font-variant-numeric:tabular-nums;font-weight:700}
.ledger .v.p{color:var(--jade)}.ledger .v.n{color:var(--cinnabar)}
.epitaph{font-size:15px;line-height:1.8}
.soup{display:grid;gap:14px}
.option{background:var(--night-2);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:8px}
.option h3{margin:0;font-family:var(--font-brush);font-size:24px;color:var(--paper)}
.option p{margin:0;color:var(--mist);font-size:14px}
.option.nirvana{border-color:var(--gold)}
.option.nirvana h3{color:var(--gold)}
.newach{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* codex */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mist);font-weight:500;font-size:12px;letter-spacing:.06em}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ach{border:1px solid var(--line);border-radius:4px;padding:10px;font-size:13px;color:var(--mist)}
.ach b{display:block;font-family:var(--font-brush);font-size:18px;color:var(--glow)}
.ach.on{border-color:var(--gold)}
.ach.on b{color:var(--gold)}
.ach.off{opacity:.45}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mist)}
.remake{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:10px;max-width:720px}
.remake h3{margin:0;font-family:var(--font-brush);font-size:22px;color:var(--paper)}
.remake p{margin:0;color:var(--mist);font-size:14px}
.remake select{background:var(--night-2);color:var(--glow);border:1px solid var(--line);border-radius:3px;padding:9px 10px;font:inherit;max-width:100%;min-width:0;flex:1 1 220px}
.toggle{font-size:13px;color:var(--mist);display:flex;gap:8px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.source{font-size:12px;color:var(--mist);max-width:70ch;margin:0;opacity:.85}
.foot{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:8px;font-size:12px;color:var(--mist);max-width:80ch}
.foot p{margin:0}
.foot b{color:var(--glow);font-weight:500}
.foot a{color:var(--mist)}
.end{max-width:640px;padding:60px 0;display:grid;gap:18px}
.end h2{font-family:var(--font-brush);font-size:clamp(48px,10vw,88px);margin:0;color:var(--gold);letter-spacing:.2em}
</style>
</head>

  const cls = wpick([0,1,2,3,4,5], i => ps[i]);

  return {ci, cls, oneIn: Math.max(1, Math.round(1 / real))};

  if(S.career) return G() * (S.career.path==='monk' && !F(S.career.faith).ascetic ? CLERGY_PAY : CAREER_PAY[S.career.path])[S.career.rank];
  if(S.job==='退休人士') return G() * (C().t>=4 ? .3 : .05);
  if(S.job) return G() * (JOB_PAY[S.job] ?? .7);
  return 0;
}
function spending(inc){
  if(S.jail) return 0;
  if(S.flags.studying) return G() * .5;
  if(!S.job && !S.career) return 0; // 未出身，屋企養
  let rate = SAVE_RATE[S.cls] + (S.flags.uni ? .05 : 0) - (S.kids && S.age < 55 ? .03*S.kids : 0) - (S.married ? .02 : 0);
  if(S.status==='visa' && S.visa==='work' && C().t>=4 && COUNTRIES[S.home].t<=3) rate += .25; // 外勞慳錢寄返屋企
  return Math.max(G() * .2, inc * (1 - clamp(rate, -.2, .6)));
}
function syncWealth(){
  S.money = Math.max(S.money, -5 * G());
  S.wealth = clamp(Math.round(20 * Math.log(1 + 2 * Math.max(0, S.money) / G())), 0, 100);
  if(S.money >= 1e6) ach('millionaire');
  if(S.money >= 1e9) ach('billionaire');
  S.peakMoney = Math.max(S.peakMoney || 0, S.money);
}
function pay(usd){ S.money -= usd; syncWealth(); }

const ISO = Object.fromEntries(COUNTRIES.map((c,i) => [c.iso, i]));
const byIso = k => COUNTRIES[ISO[k]];
const isCitizen = () => S.cit.includes(S.ci);
function statusLabel(){
  if(isCitizen()) return '公民';
  return {visa:{study:'學生簽證',work:'工作簽證',retire:'退休簽證'}[S.visa]||'簽證', pr:'永久居民', illegal:'冇身份'}[S.status] || '簽證';
}
function moveTo(ci, status, visa){
  const from = C().n;
  S.ci = ci; S.status = status; S.visa = visa || null; S.yearsHere = 0;
  if(S.cit.includes(ci)){ S.status = 'citizen'; S.visa = null; }
  else { S.flags.migrated = 1; ach('migrant'); }
  S.visited[COUNTRIES[ci].iso] = 1;
  syncWealth();
  return from;
}
function passportTier(){ return Math.max(...S.cit.map(i => COUNTRIES[i].t)); }
function destChoices(isos, n){
  return shuffle(isos.filter(k => ISO[k]!=null && ISO[k]!==S.ci && !S.cit.includes(ISO[k]))).slice(0, n).map(k => ISO[k]);
}

/* ============ 年度推進 ============ */
function hazard(){
  const c = C();
  const mod = [1.6,1.25,1,.6,.35,.25][S.cls];
  let h;
  if(S.age < 5) h = c.u5/1000 * .3/4 * mod;
  else if(S.age < 15) h = .0005 * (c.u5/20) * mod;
  else h = Math.exp(-10.4 + .088*S.age) * Math.exp((76 - c.le)*.05) * (S.cls>=4?.75:S.cls===0?1.3:1) + .0005;
  if(S.hp < 40) h *= 2; if(S.hp < 20) h *= 4; if(S.hp <= 3) h += .35;
  if(S.flags.smoker) h *= 1.4;
  if(S.flags.careful) h *= .85;
  if(S.career && S.career.path==='gang') h += .004*(S.career.rank+1);
  if(c.war) h += .003;
  if(SOUL.K < -60) h *= 1.15;
  return h;
}
function deathCause(){
  const c = C();
  if(S.age < 5) return pick(c.t<=2?['肺炎','腹瀉','瘧疾','營養不良','早產併發症']:['先天疾病','肺炎','意外']);
  if(c.war && R()<.3) return '戰火';
  if(S.age >= 15 && R() < .03) return pick(['睇搞笑片笑到斷氣','食湯圓鯁親','打麻雀食糊太興奮','被跌落嚟嘅椰子擊中','自拍時倒後行跌落山']);
  if(S.age < 45) return pick(c.t<=2?['瘧疾','結核病','交通意外','工業意外','急病','暴力事件']:['交通意外','工業意外','急病','自殺','癌症']);
  if(S.flags.smoker && R()<.5) return '肺癌';
  return pick(['心臟病','中風','癌症','肺炎','腎衰竭', S.age>85?'壽終正寢':'糖尿病併發症']);
}
function assignJob(){
  const t = C().t, c = S.cls;
  let pool;
  if(S.flags.uni) pool = t>=4 ? ['工程師','會計師','律師','醫生','程式員','教師'] : ['工程師','教師','公務員','會計','醫生'];
  else if(c <= 1) pool = t<=2 ? ['小農','建築散工','人力車伕','街頭小販','製衣廠工人','漁民','家庭傭工','外送員'] : ['工廠工人','外送員','清潔工','建築工人','保安'];
  else if(c <= 3) pool = ['工廠工人','店員','司機','文員','廚師','外送員','保安','護理員'];
  else pool = ['家族企業經理','投資銀行家','律師','醫生'];
  S.job = pick(pool);
  return S.job;
}
function yearTick(){
  S.age++;
  if(S.beast) return;
  const c = C();
  // 健康老化
  if(S.age > 45) fx({hp:-(S.age>70?1:.4)});
  else if(S.hp < 70) fx({hp:1.5});
  if(S.flags.smoker) fx({hp:-.3});
  if(S.flags.addict) fx({hp:-2,wealth:-2});
  // 搵錢同使錢（US$）：人工跟居住國收入水平，儲蓄率跟出身
  const inc = income();
  S.money += inc - spending(inc);
  if(!isCitizen()) S.yearsHere++;
  if(S.flags.studying) S.studyLeft--;
  syncWealth();
  if(S.jail){ fx({hap:-2}); S.jail--; if(S.jail===0) logE('你刑滿出獄。外面嘅世界變咗好多。'); }
  if(S.age===65 && S.job && !S.career && S.job!=='退休人士'){ S.job = '退休人士'; logE(C().t>=4 ? '你退休喇，開始攞退休金。' : '你退休喇。冇乜退休金，靠積蓄同仔女。'); }
  S.hap = clamp(S.hap + (50 - S.hap)*.04, 0, 100);
  if(S.age===20 && S.flags.uniPending){ delete S.flags.uniPending; }
  // 出嚟做嘢
  if(!S.job && !S.career && !S.jail && !S.flags.studying && ((S.age===14 && S.cls<=1 && c.t<=2 && !S.flags.school) || (S.age>=18 && !S.flags.uniPending && !S.flags.uni) || (S.age>=22 && S.flags.uni))){
    const j = assignJob();
    logE(S.age<16 ? `你${S.age}歲就要出嚟做嘢，做${j}。` : `你開始做${j}。`);
  }
  if(R() < hazard()) die(deathCause());
}
function stepYears(){
  if(S.beast) return 1;
  if(S.age < 1) return 1;
  if(S.age < 12) return ri(2,3);
  if(S.age < 18) return ri(1,2);
  if(S.age < 65) return ri(2,3);
  return ri(2,4);
}

function examResult(bonus){
  const p = S.int/120 + bonus + (S.cls>=3?.1:0);
  if(R() < p){ S.flags.uniPending = 1; fx({hap:5}); return '放榜，你考到大學嘅分數。'; }
  return '放榜，分數唔夠入大學。';
}
function doMigrate(di, illegal){
  const d = COUNTRIES[di];
  const from = moveTo(di, illegal ? 'illegal' : 'visa', illegal ? null : 'work');
  if(illegal){ S.job = pick(['餐館洗碗','黑工','農場散工','建築散工']); fx({hap:-5}); return `你由${from}偷渡到咗${d.n}。冇身份，只可以做${S.job}。`; }
  S.job = pick(['餐館侍應','超市理貨','的士司機','護理員']);
  return `你移民到${d.n}。你以前嘅學歷唔被承認，由${S.job}做起。`;
}
function startCareer(path, txt){
  S.career = {path, rank:0};
  if(path==='monk') S.career.faith = clergyFaith();
  S.job = CAREERS[path].ranks[0];
  if(!S.peak || S.peak.rank < 0) S.peak = {path, rank:0, faith:S.career.faith};
  if(path==='gang'){ fx({jiang:10}); bad(3,'加入黑社會'); }
  if(path==='monk'){ const f = F(S.career.faith); fx({wealth:f.ascetic?-30:-5,hap:5}); good(3,'發心'+f.name); if(S.married && S.career.faith==='bud') bad(3,'拋妻棄子'); }
  if(path==='biz') fx({wealth:-10});
  return txt;
}
function crossChoices(mid){
  const o = [];
  const cur = S.career && S.career.path;
  if(cur!=='gang' && (S.jiang>=10||S.cls<=2)) o.push({t:'加入社團，搵快錢',go:()=>startCareer('gang','你斟茶拜咗大佬，正式入咗社團。')});
  if(cur!=='music' && (S.flags.music||tl('樂感'))) o.push({t:'辭工，全職玩音樂',go:()=>startCareer('music','你揹住結他去街頭賣唱，第一晚收咗幾個銀仔。')});
  if(cur!=='biz' && (S.wealth>=15||tl('商才'))) o.push({t:'拎晒積蓄出嚟創業',go:()=>startCareer('biz','你開咗一間小店。')});
  if(cur!=='pol' && S.age>=18) o.push({t:'投身社運／從政',go:()=>startCareer('pol', C().auth?'喺呢個國家搞政治係危險嘅。你仍然企咗出嚟。':'你開始落區派傳單。')});
  if(cur!=='monk' && S.faith!=='none') o.push({t:F().join,special:S.flags.zen||tl('靈性'),go:()=>startCareer('monk',F().joinTxt)});
  if(cur!=='sci' && S.int>=60 && S.age<=40) o.push({t:'返去讀研究院做研究',go:()=>startCareer('sci','你重新做返學生。')});
  if(cur!=='kol' && S.age<=50 && (S.flags.viral||C().t>=2)) o.push({t:'全職做網紅',go:()=>startCareer('kol', S.flags.viral?'你上次條爆片仲有人記得，你開咗個頻道。':'你買咗支自拍神棍，開咗個頻道。')});
  if(cur!=='fortune' && S.age>=25) o.push({t:'擺檔睇相，做玄學大師',go:()=>startCareer('fortune','你喺廟街擺咗張摺枱，寫住「鐵口直斷」。')});
  if(cur!=='sport' && S.flags.athlete && S.age<=26) o.push({t:'轉做職業運動員',go:()=>startCareer('sport','你重新落場。')});
  if(cur!=='mil' && S.age<=30) o.push({t:'參軍',go:()=>startCareer('mil','你著上軍服。')});
  const out = shuffle(o).slice(0, 3);
  out.push({t:mid?'算啦，繼續過平凡日子':'維持現狀',go:()=>mid?'你諗咗一晚，最後都係返工。大部份人都係咁。':'你冇改變乜嘢。'});
  return out;
}
function tryPromo(dirty){
  const k = S.career.path, K = CAREERS[k], r = S.career.rank;
  let p = K.base + (S[K.stat]||0)/220 + tl(K.tal)*.1 - r*.04 + (dirty?.25:0);
  if(k==='monk') p += Math.max(0, S.merit - S.sin)/200;
  if(k==='music' && S.flags.music) p += .05;
  if(dirty) bad(K.dirtySin, K.dirtyWhy);
  else if(K.cleanMerit) good(K.cleanMerit, K.cleanWhy);
  if(!dirty && K.risk && R() < K.risk){ die(K.riskCause); return K.riskText; }
  if(R() < p){
    S.career.rank++;
    const nr = K.ranks[S.career.rank];
    S.job = nr;
    fx(K.upFx);
    if(K.upSin) bad(K.upSin[0], K.upSin[1]);
    if(!S.peak || S.career.rank >= S.peak.rank) S.peak = {path:k, rank:S.career.rank, faith:S.career.faith};
    if(S.career.rank===4) ach(K.ach);
    if(k==='monk' && S.career.rank>=3) SOUL.exit = S.career.faith;
    if(k==='sci' && S.career.rank>=3 && S.faith==='none') SOUL.exit = 'none';
    return `${K.win}你成為「${nr}」。`;
  }
  fx(K.failFx);
  if(dirty && K.dirtyJail && R()<K.dirtyJail){ jail(ri(2,6)); S.career=null; return '事敗，你被捕。'; }
  if(K.failJail && R()<K.failJail){ jail(ri(2,6)); return K.fail + '仲俾差人拉咗。'; }
  if(K.authJail && C().auth && R()<K.authJail){ jail(ri(3,10)); S.career=null; return '當局以「顛覆」罪名拘捕你。'; }
  return K.fail;
}

function eligible(e){
  if(S.beast){ return e.beast===S.beast || e.beast==='any'; }
  if(e.beast) return false;
  if(!!S.jail !== !!e.jail) return false;
  if(e.a && (S.age < e.a[0] || S.age > e.a[1])) return false;
  if(e.once!==false && S.seen[e.id]) return false;
  if(e.once===false && S.last[e.id]!=null && S.age - S.last[e.id] < (e.jail||S.beast?0:3) && !e.id.endsWith('fill')) return false;
  if(e.if && !e.if()) return false;
  return true;
}
function pickEvent(){
  const pool = EVENTS.filter(eligible);
  return wpick(pool, e => typeof e.w==='function' ? e.w() : (e.w||1));
}
const EV = Object.fromEntries(EVENTS.map(e => [e.id, e]));

/* ============ 回合 ============ */
function logE(text, kind){ if(text) S.log.push({y:S.beast?'':S.age, t:text, k:kind||'', d:S.lastK||0}); S.lastK = 0; }
function advance(){
  if(S.alive){
    const yrs = stepYears();
    if(S.age===0 && !S.beast){
      // 第一年：嬰兒死亡率
      const c = C(); const mod = [1.6,1.25,1,.6,.35,.25][S.cls] * (SOUL.K<0 ? 1 + (-SOUL.K)/200 : 1);
      S.age = 1;
      if(R() < c.u5/1000*.7*mod){ die(deathCause()); ach('infant'); }
    } else {
      for(let i=0;i<yrs;i++){ yearTick(); if(!S.alive) break; }
    }
    if(S.beast){ S.bturns++; if(S.bturns > S.blife){ die(BEASTS[S.beast].cause); } }
  }
  if(!S.alive){ logE(deathLine(), 'death'); S.pending=null; save(); render(); return; }
  const e = pickEvent();
  S.seen[e.id] = 1; S.last[e.id] = S.age;
  const head = e.text();
  if(e.go){ const out = e.go(); logE(head + (out?' '+out:'')); S.pending = null;
    if(!S.alive){ logE(deathLine(), 'death'); }
  } else { S.pending = {id:e.id, text:head}; CH = null; }
  save(); render();
}
function deathLine(){
  if(S.beast) return `你${S.cause}。`;
  const when = S.age<=1 ? '你未滿一歲' : `你喺${S.age}歲`;
  return S.cause==='壽終正寢' ? `${when}壽終正寢。` : `${when}死於${S.cause}。`;
}
// 選項快取放喺 S 外面：入面有 function，唔可以 JSON 化
let CH = null, CH_KEY = '';
function currentChoices(){
  const e = EV[S.pending.id], key = S.pending.id + '@' + S.age;
  if(!CH || CH_KEY !== key){
    CH = typeof e.choices==='function' ? e.choices() : e.choices.filter(c => !c.if || c.if());
    CH_KEY = key;
  }
  return CH;
}
function choose(i){
  const ch = currentChoices()[i];
  logE(S.pending.text);
  const out = ch.go();
  S.log.push({y:'', t:'›  ' + ch.t, k:'choice', d:S.lastK||0}); S.lastK = 0;
  if(out) logE(out);
  S.pending = null; CH = null;
  if(!S.alive) logE(deathLine(), 'death');
  save(); render();
}

/* ============ 審判 ============ */
function judge(){
  if(UI.judge){ UI.screen = 'judge'; render(); return; }
  const net = S.merit - S.sin;
  if(!S.beast){
    if(S.age>=100) ach('centenarian');
    if(S.merit>=60) ach('saint');
    if(S.sin>=60) ach('villain');
  }
  const prevK = SOUL.K;
  const newK = Math.round(prevK*.6 + net);
  const peakTitle = S.peak ? rankName(S.peak.path, S.peak.rank, S.peak.faith) : (S.job || (S.beast?S.name:'—'));
  // 今世可得天賦
  const gain = [];
  if(!S.beast){
    if(S.int>=75) gain.push('慧根');
    if(S.age>=90) gain.push('體魄');
    if(S.merit>=40) gain.push('仁心');
    if(S.peak && S.peak.rank>=2){ const t = CAREERS[S.peak.path].tal; if(!gain.includes(t)) gain.push(t); }
    if(S.flags.music && !gain.includes('樂感')) gain.push('樂感');
    if(S.jiang>=50 && !gain.includes('江湖')) gain.push('江湖');
  }
  // 唔信輪迴嘅人，死後見到閻羅王
  const surprise = S.beast ? '' : {
    chr:'你以為會見到天堂門口同聖彼得。點知迎接你嘅，係一個紅面判官。閻羅王：「唔使望喇，呢度係東區分部。你哋總部爆滿，外判咗俾我哋。」',
    mus:'你等緊兩位天使嚟問你墳墓三問。等咗好耐，嚟咗牛頭馬面。',
    jew:'你以為會喺度等彌賽亞。閻羅王翻開本簿：「你哋卡巴拉都有講轉世（gilgul），唔好扮唔知。」',
    none:'你一直以為死咗就係一片漆黑。閻羅王望住你。你：「⋯⋯我收回啲說話。」',
    hin:'你認得佢。佢係閻摩，只係換咗套唐裝。',
  }[S.faith] || '';
  if(!S.beast && !F().reinc) ach('wrongafterlife');
  UI.judge = {net, prevK, newK, peakTitle, surprise, gain:gain.slice(0,3)};
  SOUL.isekai = S.cause === '被泥頭車撞';
  SOUL.hist.push({n:SOUL.life, name:S.name, country:S.beast?(BEASTS[S.beast].realm||'畜生道'):COUNTRIES[S.home].n, faith:S.beast?'—':F().n, money:S.beast?null:Math.round(S.peakMoney||0), cls:S.beast?'—':CLASSES[S.cls], age:S.beast?'—':S.age, cause:S.cause, net, title:peakTitle});
  SOUL.K = newK;
  UI.screen = 'judge';
  save(); render();
}
function canNirvana(){ return !!SOUL.exit && SOUL.K >= 150; }
function drinkSoup(drink){
  const J = UI.judge;
  if(drink){
    SOUL.talents = {}; SOUL.mem = null; SOUL.K += 10;
  } else {
    SOUL.K -= 15; ach('memory');
    for(const t of J.gain) SOUL.talents[t] = Math.min(3, (SOUL.talents[t]||0) + 1);
    SOUL.mem = S.beast ? null : {name:S.name, country:C().n, cause:S.cause, faith:S.faith,
      career: S.peak ? rankName(S.peak.path, Math.max(1,S.peak.rank), S.peak.faith) : null, path: S.peak ? S.peak.path : null};
    if(SOUL.mem && (!S.peak || S.peak.rank < 1)) SOUL.mem.career = null;
  }
  SOUL.life++;
  if(SOUL.life >= 10) ach('ten');
  if(SOUL.K <= -200){ ach('hell'); UI.hell = true; SOUL.K += 100; } else UI.hell = false;
  S = null; UI.judge = null; UI.screen = 'birth';
  save(); render();
}

  const rows = SOUL.hist.slice().reverse().map(h => `<tr><td class="num">${h.n}</td><td>${esc(h.name)}</td><td>${esc(h.country)}</td><td>${esc(h.cls)}</td><td>${esc(h.faith||'—')}</td><td>${esc(h.title)}</td><td class="num">${h.money!=null?fmt$(h.money):'—'}</td><td class="num">${h.age}</td><td>${esc(h.cause)}</td><td class="num" style="color:${h.net>0?'#6cc3a5':h.net<0?'#e2675b':'inherit'}">${h.net>0?'+':''}${h.net}</td></tr>`).join('');
  const achs = Object.entries(ACH).map(([id,[n,d]]) => `<div class="ach ${SOUL.ach[id]?'on':'off'}"><b>${n}</b>${d}${SOUL.ach[id]?`<br>第 ${SOUL.ach[id]} 世達成`:''}</div>`).join('');
  return `<h2 class="sect-h">輪迴錄</h2><p class="sub">你嘅靈魂經歷過嘅每一世。</p>
    ${rows?`<div class="tablewrap"><table><thead><tr><th>世</th><th>名</th><th>出生地</th><th>出身</th><th>信仰</th><th>最高身份</th><th>最高身家</th><th>享年</th><th>死因</th><th>淨德</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="sub">仲未有前世。</p>'}
    <h2 class="sect-h" style="margin-top:28px">成就</h2><div class="achgrid">${achs}</div>
    <div class="row" style="margin-top:22px"><button class="btn ghost" data-a="back">返回</button></div>`;
}
function viewNirvana(){
  const X = F(SOUL.exit || 'bud');
  return `<section class="end"><h2>${ACH[X.exit][0]}</h2>
    <p class="sub">${X.exitTxt.replace('{n}', SOUL.life)}</p>
    <p class="sub">世上仲有無數眾生喺輪迴入面，抽緊佢哋嘅出身。</p>
    <div class="row"><button class="btn ghost" data-a="codex">睇輪迴錄</button><button class="btn" data-a="reset">以新靈魂重新開始</button></div></section>`;
}
function bind(){
  const sel = $('#birthCountry');
  if(sel) sel.onchange = () => { UI.birthPick = +sel.value; save(); render(); };
  const fm = $('#freeMode');
  if(fm) fm.onchange = () => { SOUL.free = fm.checked; save(); render(); };
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a, i = +b.dataset.i, before = UI.screen;
    if(a==='begin'){ UI.screen='birth'; save(); render(); }
    else if(a==='continue'){ UI.screen = UI.judge ? 'judge' : S ? 'life' : 'birth'; render(); }
    else if(a==='codex'){ UI.prev = UI.screen; UI.screen='codex'; render(); }
    else if(a==='back'){ UI.screen = UI.prev && UI.prev!=='codex' ? UI.prev : 'title'; render(); }
    else if(a==='askreset'){ UI.askReset = true; render(); }
    else if(a==='cancelreset'){ UI.askReset = false; render(); }
    else if(a==='reset'){ SOUL = freshSoul(); S = null; UI = {screen:'title'}; save(); render(); }
    else if(a==='born') startLife(SOUL.births[i]);
    else if(a==='next') advance();
    else if(a==='choose') choose(i);
    else if(a==='judge') judge();
    else if(a==='drink') drinkSoup(true);
    else if(a==='refuse') drinkSoup(false);
    else if(a==='nirvana') nirvana();
    else if(a==='remake') remake();
    if(UI.screen !== before) window.scrollTo({top:0});
  });
}

load();
if(UI.screen==='codex') UI.screen = 'title';
if(UI.screen!=='title' && UI.screen!=='nirvana') UI.screen = 'title';
render();
</script>
</body>
</html>
